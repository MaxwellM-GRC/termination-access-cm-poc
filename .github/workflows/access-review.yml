name: Access Review (Continuous Monitoring)

# Runs the termination access review on a cadence and raises notifications when
# actionable exceptions (critical/high) are found. This workflow is EXPECTED to
# go red when exceptions exist -- that red scheduled run is itself the alert:
# GitHub emails the repo owner when a scheduled run on the default branch fails.
#
# Notification chain when critical/high findings are present:
#   1. Exception log + summary uploaded as a downloadable run artifact (evidence)
#   2. A stable GitHub Issue is maintained for each actionable finding, so its
#      owner, aging, response evidence, and closure can be audited individually
#   3. Optional Slack message if the SLACK_WEBHOOK_URL secret is configured
#   4. The job fails, triggering GitHub's built-in email to the repo owner

on:
  schedule:
    # Every weekday at 07:00 UTC. In production this runs against fresh extracts.
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}      # allow manual runs from the Actions tab
  push:
    branches: [main]         # also run on merge to main to demonstrate the flow

permissions:
  contents: read
  issues: write              # required to open/comment the exception issue

jobs:
  access-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run access review
        id: review
        # Do not stop the job on a non-zero exit; later steps handle evidence and
        # alerting, then a final step re-asserts failure so the run goes red.
        continue-on-error: true
        run: |
          python -m src.main \
            --out exception_log.csv \
            --summary-json summary.json \
            --issue-md issue_body.md \
            --fail-on high

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-review-${{ github.run_id }}
          path: |
            exception_log.csv
            summary.json
            issue_body.md
          if-no-files-found: warn

      - name: Evaluate findings
        id: check
        if: always()
        run: |
          python - << 'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("summary.json"))
          c = d["counts_by_severity"]
          actionable = c["critical"] + c["high"]
          print(f"actionable={'true' if actionable else 'false'}")
          print(f"count={actionable}")
          PY

      - name: Open or update individual exception cases
        if: always() && steps.check.outputs.actionable == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = JSON.parse(fs.readFileSync('summary.json', 'utf8'));
            const label = 'access-exception';
            const caseLabel = 'access-exception-case';
            const { owner, repo } = context.repo;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            await ensureLabel(label, 'd73a4a', 'Automated access-control exception');
            await ensureLabel(caseLabel, 'b60205', 'Individual automated access-control exception case');

            const cases = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: caseLabel, per_page: 100,
            });

            async function tryAssign(issueNumber, handle) {
              if (!handle || !handle.startsWith('@') || handle.includes('/')) return;
              try {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: issueNumber, assignees: [handle.slice(1)],
                });
              } catch (e) {
                core.warning(`Could not assign ${handle}: ${e.message}`);
              }
            }

            function bodyFor(finding) {
              const r = finding;
              return [
                `<!-- finding-id:${r.finding_id} -->`,
                `# Access exception: ${r.rule}`,
                '',
                `- **Finding ID:** \`${r.finding_id}\``,
                `- **Severity:** ${r.severity}`,
                `- **System:** ${r.system}`,
                `- **Account:** ${r.account_id}`,
                `- **Employee ID:** ${r.employee_id}`,
                `- **Termination date:** ${r.termination_date}`,
                `- **Owner:** ${r.owner || 'Unassigned'}`,
                '',
                '## Detection detail',
                r.detail,
                '',
                '## Required response',
                `- [ ] **Remediation:** ${r.remediation || 'Document corrective action.'}`,
                `- [ ] **Mitigation/lookback:** ${r.mitigation || 'Assess exposure.'}`,
                `- [ ] **Root cause:** ${r.root_cause || 'Document root cause.'}`,
                `- [ ] **Closure evidence:** ${r.closure_evidence || 'Attach closure evidence.'}`,
                `- **Escalation:** ${r.escalation || 'Follow the remediation SLA.'}`,
                '',
                'Close this case only after all applicable response evidence is retained.',
              ].join('\n');
            }

            const actionable = summary.findings.filter(f =>
              ['critical', 'high'].includes(f.severity)
            );
            for (const finding of actionable) {
              const marker = `<!-- finding-id:${finding.finding_id} -->`;
              const existing = cases.find(issue => (issue.body || '').includes(marker));
              const body = bodyFor(finding);
              let number;
              if (existing) {
                number = existing.number;
                if (existing.state === 'closed') {
                  await github.rest.issues.update({ owner, repo, issue_number: number, state: 'open' });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number,
                    body: `Finding recurred in run ${context.runId}; reopening this case.`,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number,
                    body: `Finding remains open in run ${context.runId}. See the retained workflow evidence for the current observation.`,
                  });
                }
              } else {
                const res = await github.rest.issues.create({
                  owner, repo,
                  title: `[Access Exception] ${finding.rule} — ${finding.system} — ${finding.employee_id}`,
                  body,
                  labels: [label, caseLabel],
                });
                number = res.data.number;
              }
              await tryAssign(number, finding.owner);
              core.info(`Maintained exception case #${number} for ${finding.finding_id}`);
            }

      - name: Notify Slack
        if: always() && steps.check.outputs.actionable == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COUNT="${{ steps.check.outputs.count }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(python - "$COUNT" "$RUN_URL" << 'PY'
          import json, sys
          count, url = sys.argv[1], sys.argv[2]
          text = (f":rotating_light: Termination access review found {count} "
                  f"actionable exception case(s) (critical/high).\n{url}")
          print(json.dumps({"text": text}))
          PY
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Fail run if actionable exceptions exist
        if: always() && steps.check.outputs.actionable == 'true'
        run: |
          echo "Actionable exceptions present -- failing the run to alert."
          exit 1
